<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fretmap</title>
<style>
  :root {
    --bg: #f5f5f4;
    --panel: #ffffff;
    --border: #d6d3d1;
    --text: #1c1917;
    --muted: #78716c;
    --faint: #a8a29e;
    --string: #a8a29e;
    --fret: #d6d3d1;
    --nut: #57534e;
    --capo: #8e6b3e;
    --inlay: #e7e5e4;
    --focus: #0072B2;
    --root: #D55E00;
    --third: #0072B2;
    --fifth: #009E73;
    --seventh: #CC79A7;
    --extension: #E69F00;
    --bass: #78716c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917;
      --panel: #292524;
      --border: #44403c;
      --text: #f5f5f4;
      --muted: #a8a29e;
      --faint: #78716c;
      --string: #78716c;
      --fret: #44403c;
      --nut: #d6d3d1;
      --capo: #b08850;
      --inlay: #33302e;
      --focus: #56B4E9;
      --bass: #a8a29e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button, select, input { font: inherit; color: inherit; }
  select, input, button { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; }
  button { cursor: pointer; }
  button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .field { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
  .field select { color: var(--text); }
  .icon { padding: 5px 9px; }
  .save-form { display: inline-flex; gap: 6px; }
  .save-form[hidden] { display: none; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; }
  .seg button:first-child { border-radius: 6px 0 0 6px; }
  .seg button:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
  .key-controls { display: inline-flex; gap: 6px; align-items: center; }
  .key-controls[hidden] { display: none; }
  .settings { position: relative; }
  .settings summary { list-style: none; cursor: pointer; border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px; }
  .settings summary::-webkit-details-marker { display: none; }
  .settings .panel { position: absolute; right: 0; top: calc(100% + 6px); z-index: 5; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px; white-space: nowrap; }

  .search-slot { flex: 1 1 240px; min-width: 200px; }
  .search { position: relative; }
  .search input { width: 100%; }
  .search ul { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 10; margin: 0; padding: 4px; list-style: none; max-height: 360px; overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgb(0 0 0 / .15); }
  .search li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 8px; border-radius: 5px; cursor: pointer; }
  .search li .name { color: var(--muted); font-size: 12px; }
  .search li[aria-selected="true"] { background: var(--bg); }
  .search li.empty { color: var(--muted); cursor: default; }

  main { padding: 16px; }
  .board { display: flex; align-items: flex-start; overflow-x: auto; padding-bottom: 4px; }
  .tuners { flex: none; display: flex; flex-direction: column; margin-right: 6px; }
  .tuner { height: 40px; display: flex; align-items: center; gap: 2px; }
  .tuner button { padding: 0 5px; height: 24px; font-size: 10px; line-height: 1; color: var(--muted); }
  .tuner .note { min-width: 38px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tuner button:disabled { opacity: .35; cursor: default; }
  .board svg { flex: none; display: block; }
  .board text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  .info { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 14px; color: var(--muted); }
  .info b { color: var(--text); font-weight: 600; }
  .info .title b { font-size: 16px; }

  .shapes { margin-top: 20px; }
  .shapes h2 { margin: 0 0 10px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .shapes-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 10px; }
  .shapes-head h2 { margin: 0; }
  .seg-label { color: var(--muted); font-size: 13px; }
  .shapes .seg button { padding: 3px 10px; font-size: 13px; }
  .shapes .seg button + button { border-left: 0; }
  .shape-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .shape-box { display: flex; flex-direction: column; align-items: center; gap: 1px; width: 118px; padding: 8px 6px; font-size: 11px; line-height: 1.35; color: var(--muted); }
  .shape-box svg { display: block; color: var(--text); margin-bottom: 4px; }
  /* Selected: tinted fill and a solid text-coloured border. Focus keeps the blue outline ring
     (offset), so the two never look alike. Padding drops 1px to absorb the thicker border. */
  .shape-box[aria-pressed="true"] { background: color-mix(in srgb, var(--focus) 14%, var(--panel)); color: var(--text); border: 2px solid var(--text); padding: 7px 5px; }
  .shape-box:focus-visible { outline-offset: 3px; }
  .shapes .more { margin-top: 12px; }
  .shapes .empty { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<header class="toolbar" id="toolbar"></header>
<main>
  <div class="board" id="board"></div>
  <div class="info" id="info"></div>
  <section class="shapes" id="shapes" hidden></section>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
